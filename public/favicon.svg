<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="dot">
      <stop offset="0.62" stop-color="var(--d)"/>
      <stop offset="1" stop-color="var(--d)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sh">
      <stop offset="0" stop-color="var(--s)" stop-opacity=".55"/>
      <stop offset="1" stop-color="var(--s)" stop-opacity="0"/>
    </radialGradient>
    <style>
      :root { --d: #111114; --s: #8A8B92 }
      @media (prefers-color-scheme: dark) {
        :root { --d: #E8E8EA; --s: #5A5B62 }
      }
    </style>
  </defs>
  <ellipse cx="37" cy="38" rx="20" ry="16" fill="url(#sh)"/>
  <circle cx="28" cy="27" r="20" fill="url(#dot)"/>
</svg>
